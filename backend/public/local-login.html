<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in - Small Business Command Center</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px system-ui;background:#f3f5f8;padding:2rem}main{max-width:420px;margin:3rem auto;background:white;padding:2rem;border-radius:18px;box-shadow:0 5px 20px #0001}label{display:block;margin:16px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:7px}button{padding:12px 18px;background:#2441a2;color:white;border:0;border-radius:8px;cursor:pointer}p#error{color:#bc2020}</style></head><body><main><h1>Small Business Command Center</h1><p>Sign in, or create an account with an email and a password of at least 10 characters.</p><form id="f"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="pw" required minlength="10" autocomplete="current-password"></label><button type="submit">Sign in</button> <button type="button" id="register">Create account</button></form><p id="error" role="alert"></p></main><script>async function send(register){let error=document.getElementById('error');error.textContent='';try{let token=await (await fetch('/api/csrf')).json();let res=await fetch('/api/'+(register?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','X-CSRF-TOKEN':token.csrfToken},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pw').value})});let data=await res.json();if(!res.ok)throw new Error(data.message||data.error||'Login failed');if(register)return send(false);location.assign('/');}catch(e){error.textContent=e.message}}document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();send(false)});document.getElementById('register').addEventListener('click',()=>send(true));</script></body></html>
